<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cellflow CRM | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-modal">
        <div class="login-box">
            <h2>Admin Portal</h2>
            <input type="text" id="adminId" placeholder="User ID">
            <input type="password" id="adminPass" placeholder="Password">
            <button onclick="verifyLogin()">Login to Dashboard</button>
        </div>
    </div>

    <!-- Full Screen Loader -->
    <div id="appLoader" class="app-loader">
        <h2>Loading Data...</h2>
    </div>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo">Cellflow <span>CRM</span></div>
        <div class="admin-profile">D</div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-logo">Cellflow <span>CRM</span></div>
            <ul class="nav-links">
                <li class="active" onclick="switchTab('Payment Pending', event)">💳 Payment Pending</li>
                <li onclick="switchTab('Work Pending', event)">⏳ Work Pending</li>
                <li onclick="switchTab('Completed', event)">✅ Completed</li>
            </ul>
        </nav>

        <!-- Main Dashboard Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <h2 id="currentTabTitle">Payment Pending</h2>
                <button class="btn-refresh" onclick="refreshData()">🔄 Refresh</button>
            </div>
            <div id="orderFeed" class="order-feed">
                <!-- Data injected here -->
            </div>
        </main>
    </div>

    <!-- Dynamic Action Modal -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('actionModal')">✕</span>
            <h3 id="modalTitle" style="margin-bottom: 15px;">Manage Order</h3>
            <div id="modalBody">
                <!-- Action inputs and buttons injected here -->
            </div>
        </div>
    </div>

    <!-- View Tracker Modal -->
    <div id="trackerModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('trackerModal')">✕</span>
            <h3>Pipeline: <span id="track-id"></span></h3>
            <div class="timeline" id="trackerTimeline">
                <!-- Timeline injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
