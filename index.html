<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cellflow CRM | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Full Screen Loader with Logo -->
    <div id="appLoader" class="app-loader active">
        <img src="logo.png" alt="Cellflow Logo" class="loader-logo">
        <p>Syncing with Google Sheets...</p>
    </div>

    <!-- Mobile Header -->
    <header class="mobile-header">
        <div class="logo"><img src="logo.png" alt="Logo" style="width:24px; vertical-align:middle; margin-right:5px;"> Cellflow <span>CRM</span></div>
        <div class="admin-profile">D</div>
    </header>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-logo"><img src="logo.png" alt="Logo" style="width:30px; vertical-align:middle; margin-right:8px;"> Cellflow <span>CRM</span></div>
            <ul class="nav-links">
                <li class="active" onclick="switchTab('Payment Pending')">💳 Payment Pending</li>
                <li onclick="switchTab('Work Pending')">⏳ Work Pending</li>
                <li onclick="switchTab('Completed')">✅ Completed</li>
                <li onclick="switchTab('Settings')">⚙️ Settings</li>
            </ul>
        </nav>

        <!-- Main Dashboard Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <h2 id="currentTabTitle">Payment Pending</h2>
                <button class="btn-refresh" onclick="refreshData()">🔄 Refresh</button>
            </div>

            <div id="orderFeed" class="order-feed">
                <!-- Data injected here -->
            </div>
        </main>
    </div>

    <!-- Action Modal for Quotes, Emails, and Delivery -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Manage Order</h3>
                <span class="close-btn" onclick="closeModal()">✕</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Action inputs and buttons injected here -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
