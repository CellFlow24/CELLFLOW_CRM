<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cellflow CRM | Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login Overlay -->
    <div id="loginOverlay" class="login-modal">
        <div class="login-box">
            <h2>Admin Portal</h2>
            <input type="text" id="adminId" placeholder="User ID">
            <input type="password" id="adminPass" placeholder="Password">
            <button onclick="verifyLogin()">Login to Dashboard</button>
        </div>
    </div>

    <!-- Full Screen Loader -->
    <div id="appLoader" class="app-loader">
        <img src="logo.png" alt="Cellflow Logo" class="loader-logo">
        <p style="color: #64748b; font-weight: bold;">Syncing with Google Sheets...</p>
    </div>

    <!-- Mobile Header (Updated for larger centered logo) -->
    <header class="mobile-header">
        <div class="header-center">
            <img src="logo.png" alt="Logo" class="mobile-logo-img">
            <div class="logo-text">Cellflow <span>CRM</span></div>
        </div>
        <div class="admin-profile">D</div>
    </header>

    <div class="app-container">
        <!-- Desktop Sidebar Navigation -->
        <nav class="sidebar">
            <div class="sidebar-logo"><img src="logo.png" alt="Logo" style="width:30px; vertical-align:middle; margin-right:8px;"> Cellflow <span>CRM</span></div>
            <ul class="nav-links">
                <li class="active" onclick="switchTab('Inquiries', event)">📩 Inquiries</li>
                <li onclick="switchTab('Payment Pending', event)">💳 Payment Pending</li>
                <li onclick="switchTab('Work Pending', event)">⏳ Work Pending</li>
                <li onclick="switchTab('Completed', event)">✅ Completed</li>
                <li onclick="switchTab('Settings', event)">⚙️ Settings</li>
            </ul>
        </nav>

        <!-- Main Dashboard Content -->
        <main class="dashboard-content">
            <div class="dashboard-header">
                <h2 id="currentTabTitle">Inquiries</h2>
                <button class="btn-refresh" onclick="refreshData()">🔄 Refresh</button>
            </div>
            
            <div id="orderFeed" class="order-feed"></div>

            <div id="settingsFeed" class="settings-feed" style="display: none;"></div>
        </main>
    </div>

    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-nav">
        <div class="nav-item active" onclick="switchTab('Inquiries', event)">📩<br><span>Inquiries</span></div>
        <div class="nav-item" onclick="switchTab('Payment Pending', event)">💳<br><span>Pay Pending</span></div>
        <div class="nav-item" onclick="switchTab('Work Pending', event)">⏳<br><span>Work</span></div>
        <div class="nav-item" onclick="switchTab('Completed', event)">✅<br><span>Done</span></div>
        <div class="nav-item" onclick="switchTab('Settings', event)">⚙️<br><span>Settings</span></div>
    </nav>

    <!-- Dynamic Action Modal -->
    <div id="actionModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('actionModal')">✕</span>
            <h3 id="modalTitle" style="margin-bottom: 15px;">Manage Order</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- View Tracker Modal -->
    <div id="trackerModal" class="modal-overlay">
        <div class="modal-content tracker-content">
            <span class="close-btn" onclick="closeModal('trackerModal')">✕</span>
            <h3>Pipeline: <span id="track-id"></span></h3>
            <div class="timeline" id="trackerTimeline"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
